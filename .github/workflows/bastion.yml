name: Bastion Gate

on:
  pull_request:
    branches: [ main, master ]

jobs:
  bastion-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Bastion Gate
        run: npx --yes bastion-gate gate --base "origin/${{ github.base_ref }}"
